<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Team Roster</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>Team Roster</h1>
    <table aria-label="Team members">
      <thead><tr><th>Name</th><th>Role</th><th>Actions</th></tr></thead>
      <tbody id="roster"></tbody>
    </table>
    <p id="roster-status" role="status">Loading team members…</p>
    <p id="roster-error" role="alert" hidden></p>
    <form id="add-member" aria-label="Add member">
      <label>Name <input name="name" required></label>
      <label>Role <input name="role"></label>
      <button type="submit">Add member</button>
      <p id="form-error" role="alert"></p>
    </form>
    <dialog id="remove-dialog" aria-labelledby="remove-dialog-title">
      <h2 id="remove-dialog-title"></h2>
      <p>Are you sure you want to remove this team member?</p>
      <p id="remove-error" role="alert"></p>
      <form method="dialog">
        <button value="cancel">Cancel</button>
        <button id="confirm-remove" value="confirm">Confirm</button>
      </form>
    </dialog>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
